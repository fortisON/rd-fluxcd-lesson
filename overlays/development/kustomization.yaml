apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: development

resources:
  - namespace.yaml
  - ../../base
  - dragonfly.yaml

replicas:
  - name: course-app
    count: 1

patches:
  - target:
      kind: Ingress
      name: course-app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: course-app-dev.local

  - target:
      kind: Deployment
      name: course-app
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: course-app
      spec:
        template:
          spec:
            containers:
              - name: course-app
                env:
                  - name: APP_MESSAGE
                    value: "Hello from DEVELOPMENT"
